name: CGV Odyssey Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cgv-odyssey-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && 'test' || 'watch' }}

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v6

      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Playwright 설치
        run: npm install playwright

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: CGV 확인 및 텔레그램 전송
        run: node watcher.js

      - name: 이미 알림한 회차 저장
        if: github.event_name == 'schedule'
        run: |
          if [ -n "$(git status --porcelain -- notified.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add notified.json
            git commit -m "Update notified showtimes"
            git push
          else
            echo "저장할 새로운 알림 기록이 없습니다."
          fi
